name: Deploy to Vercel (production)

# The Vercel GitHub App can't reach this repo (the repo lives on a different
# GitHub account than the Vercel team), so native auto-deploy doesn't fire.
# This Action deploys from inside GitHub using a Vercel token instead, so every
# push to main ships to production. Vercel builds remotely using the project's
# own build command (npm run build → generate:seo + vite build + prerender)
# and the project's environment variables.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Deploy to production
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
