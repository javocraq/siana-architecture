    <!-- The prerender step (scripts/prerender.mjs) writes a plain-HTML copy of
         each page into #root so crawlers that don't run JavaScript still see
         the content. React replaces it the moment it mounts - but until the
         bundle has downloaded and booted, that unstyled markup was visible as
         a flash of raw text on every cold load.

         Clipping it keeps the markup in the rendered DOM (crawlers still read
         it, unlike display:none) while taking it out of view. The paper
         background means the pre-mount moment shows the site's own colour
         rather than a white blink. -->
    <style>
      html, body { background: #ffffff; }
      #prerender {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>

    <!-- Hero photography lives on these two hosts. Opening the connections
         up front removes a DNS + TLS round trip from the critical path, so
         the cover image starts arriving sooner. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://ewxeskasseihayxhqums.supabase.co" crossorigin />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Type system:

         · Manrope         - secondary sans for titles (Arboria-like)
         · Inter           - body text (Acumin Pro-like)
         · Instrument Serif - wordmark (italic)
